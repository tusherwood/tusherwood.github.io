    Projects:
      - name: System development for a device to measure single-cell biophysical properties
        summary: As a PhD student in the Manalis Lab at MIT, I am designing and validating a suspended microchannel resonator (SMR) system for measuring single-cell biophysical properties including mass, volume, density, and morphology. I built the integrated fluidic control and optical subsystems and performed extensive system characterization and optimization. This platform has been applied to study biophysical phenomena across diverse cell types, including unicellular algae, T cells, and cancer cells undergoing epithelial-to-mesenchymal transition.
        # highlights:
        #   - Quantum Teleportation
        #   - Quantum Cryptography
        # start_date: 2018-01-01
        # end_date: 2018-01-01

      - name: Software design of a device for real-time, intraoperative arterial input function calculation
        summary: At Dartmouth College, I designed Python-based software for a portable tablet system that calculates patient-specific arterial input functions in real time from dual-wavelength pulse oximeter readings. The system features a user-configurable interface and real-time data processing backend, and was successfully deployed intraoperatively to guide bone debridement in patients with contaminated fractures.
        # highlights:
        #   - Quantum Teleportation
        #   - Quantum Cryptography
        # start_date: 2018-01-01
        # end_date: 2018-01-01

      - name: Differential equation modeling of population disease spread in the COVID-19 pandemic
        summary: As an undergraduate at Brown University, I developed differential equation models to simulate the effects of population behavior, vaccination, and public health interventions on COVID-19 transmission trajectories in the U.S. and globally. The models incorporated multi-dose vaccination, waning immunity, and behavioral responses to rising case counts, providing predictive insight into the relative impact of these factors on pandemic dynamics.
        # highlights:
        #   - Quantum Teleportation
        #   - Quantum Cryptography
        # start_date: 2018-01-01
        # end_date: 2018-01-01

      - name: Microfluidic device design for high-purity cell-free DNA extraction from blood plasma
        summary: As an undergraduate at Brown University, I designed and optimized a microfluidic device for high-purity extraction of cell-free DNA from blood plasma to improve non-invasive prenatal testing (NIPT). I combined experimental prototyping with COMSOL multiphysics simulations to optimize channel geometry, reagent formulations, and coupled electrophoretic–electroosmotic separation, achieving higher extraction purities than commercially available methods.
        # highlights:
        #   - Quantum Teleportation
        #   - Quantum Cryptography
        # start_date: 2018-01-01
        # end_date: 2018-01-01
